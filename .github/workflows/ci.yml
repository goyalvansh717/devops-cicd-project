name: CI
on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: install dependencies 
        run: pip install -r requirements.txt

      - name: run tests
        run: pyest

      - name: Build Docker image
        run: docker build -t devops-demo-app .
